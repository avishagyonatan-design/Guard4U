spring.application.name=security-system
server.port=8080

# SQL Server - SQL Server Authentication
# After creating the login in SSMS, fill in the credentials below:
spring.datasource.url=jdbc:sqlserver://localhost;databaseName=project;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=springapp
spring.datasource.password=Spring@DB2024!

# Thymeleaf
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Logging - show SQL warnings from stored procedures
logging.level.com.microsoft.sqlserver=WARN
logging.level.com.project=DEBUG
